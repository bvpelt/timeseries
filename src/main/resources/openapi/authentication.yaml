openapi: "3.0.3"
info:
  title: Authentication API
  description: |
    REST API for managing users, roles and permissions

    ## Access 
    All requests must include the JWT bearer token

  version: "1.0.0"
  contact:
    name: "BSoft Development Team"

servers:
  - url: "http://localhost:8080/{basePath}"
    description: "development"
    variables:
      basePath:
        default: "/api/auth/v1"
  - url: "https://api.example.com/{basePath}"
    description: "production"
    variables:
      basePath:
        default: "/api/auth/v1"

tags:
  - name: Roles
    description: "The roles a user can have"
  - name: Users
    description: |
      The users who have special access

paths:

  /privileges:

    get:
      tags:
        - Privileges
      summary: Retrieve all known privileges
      security:
        - ApiKeyAuth: [ ]
        - bearerAuth: [ ]
      description: |
        Retrieve all known privileges, using paging and sorting
      operationId: getPrivileges
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/size"
        - $ref: "#/components/parameters/sort"
      responses:
        '200':
          $ref: "#/components/responses/PagedPrivileges"
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'

    delete:
      tags:
        - Privileges
      summary: Delete all privileges
      security:
        - ApiKeyAuth: [ ]
        - bearerAuth: [ ]
      description: |
        Delete all privileges
      operationId: deleteAllPrivileges
      responses:
        '204':
          $ref: "#/components/responses/Deleted"
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'

    post:
      tags:
        - Privileges
      summary: Create a new privilege
      security:
        - ApiKeyAuth: [ ]
        - bearerAuth: [ ]
      description: |
        Create a new privileges
        To determine if an privileges is new the input is compared on the hash value of:
        - name        
        If the hash value already exists in the backend, the role is considered to exist
      operationId: postPrivileges
      requestBody:
        description: Request parameters
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivilegeBody"
            examples:
              privilege:
                $ref: "#/components/examples/PrivilegeBody"
      responses:
        '201':
          $ref: "#/components/responses/Privilege"
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'


  /privileges/{id}:

    get:
      tags:
        - Privileges
      summary: Retrieve the specified privilege
      security:
        - ApiKeyAuth: [ ]
        - bearerAuth: [ ]
      description: |
        Retrieve only one privilege with id privilegeId
      operationId: getPrivilege
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        '200':
          $ref: "#/components/responses/Privilege"
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'

    delete:
      tags:
        - Privileges
      summary: Delete the specified privilege
      security:
        - ApiKeyAuth: [ ]
        - bearerAuth: [ ]
      description: |
        Delete only the specified privilege
      operationId: deletePrivilege
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        '204':
          $ref: "#/components/responses/Deleted"
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'

    patch:
      tags:
        - Privileges
      summary: Update the specified privilege
      security:
        - ApiKeyAuth: [ ]
        - bearerAuth: [ ]
      description: |
        Update only the privilege specified with privilegeId
      operationId: patchPrivilege
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        description: Request parameters
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivilegeBody"
            examples:
              privilege:
                $ref: "#/components/examples/PrivilegeBody"
      responses:
        '200':
          $ref: "#/components/responses/Privilege"
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'


  /roles:

    get:
      tags:
        - Roles
      summary: Retrieve all known roles
      security:
        - ApiKeyAuth: [ ]
        - bearerAuth: [ ]
      description: |
        Retrieve all known roles, using paging and sorting
      operationId: getRoles
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/size"
        - $ref: "#/components/parameters/sort"
      responses:
        '200':
          $ref: "#/components/responses/PagedRoles"
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'

    delete:
      tags:
        - Roles
      summary: Delete all roles
      security:
        - ApiKeyAuth: [ ]
        - bearerAuth: [ ]
      description: |
        Delete all roles
      operationId: deleteAllRoles
      responses:
        '204':
          $ref: "#/components/responses/Deleted"
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'

    post:
      tags:
        - Roles
      summary: Create a new role
      security:
        - ApiKeyAuth: [ ]
        - bearerAuth: [ ]
      description: |
        Create a new role
        To determine if an role is new the input is compared on the hash value of:
        - rolename
        - description
        If the hash value already exists in the backend, the role is considered to exist
      operationId: postRole
      requestBody:
        description: Request parameters
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleBody"
            examples:
              adres:
                $ref: "#/components/examples/RoleBody"
      responses:
        '201':
          $ref: "#/components/responses/Role"
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'


  /roles/{id}:

    get:
      tags:
        - Roles
      summary: Retrieve the specified role
      security:
        - ApiKeyAuth: [ ]
        - bearerAuth: [ ]
      description: |
        Retrieve only one role with id roleId
      operationId: getRole
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        '200':
          $ref: "#/components/responses/Role"
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'

    delete:
      tags:
        - Roles
      summary: Delete the specified role
      security:
        - ApiKeyAuth: [ ]
        - bearerAuth: [ ]
      description: |
        Delete only the specified role
      operationId: deleteRole
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        '204':
          $ref: "#/components/responses/Deleted"
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'

    patch:
      tags:
        - Roles
      summary: Update the specified role
      security:
        - ApiKeyAuth: [ ]
        - bearerAuth: [ ]
      description: |
        Update only the role specified with roleId
      operationId: patchRole
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        description: Request parameters
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleBody"
            examples:
              role:
                $ref: "#/components/examples/RoleBody"
      responses:
        '200':
          $ref: "#/components/responses/Role"
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'


  /users:

    get:
      tags:
        - Users
      summary: Retrieve all known users
      security:
        - ApiKeyAuth: [ ]
        - bearerAuth: [ ]
      description: |
        Retrieve all known users, using paging and sorting
      operationId: getUsers
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/size"
        - $ref: "#/components/parameters/sort"
      responses:
        '200':
          $ref: "#/components/responses/PagedUsers"
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'

    delete:
      tags:
        - Users
      summary: Delete all
      security:
        - ApiKeyAuth: [ ]
        - bearerAuth: [ ]
      description: |
        Delete all users
      operationId: deleteAllUsers
      responses:
        '204':
          $ref: "#/components/responses/Deleted"
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'

    post:
      tags:
        - Users
      summary: Create a new user
      security:
        - ApiKeyAuth: [ ]
        - bearerAuth: [ ]
      description: |
        Create a new user
        To determine if an user is new the input is compared on the hash value of:
        - username
        - password
        - email
        - phone
        If the hash value already exists in the backend, the user is considered to exist
      operationId: postUser
      requestBody:
        description: Request parameters
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserBody"
            examples:
              adres:
                $ref: "#/components/examples/UserBody"
      responses:
        '201':
          $ref: "#/components/responses/User"
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'


  /users/{id}:

    get:
      tags:
        - Users
      summary: Retrieve the specified user
      security:
        - ApiKeyAuth: [ ]
        - bearerAuth: [ ]
      description: |
        Retrieve only one user with id userId
      operationId: getUser
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        '200':
          $ref: "#/components/responses/User"
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'

    delete:
      tags:
        - Users
      summary: Delete the specified user
      security:
        - ApiKeyAuth: [ ]
        - bearerAuth: [ ]
      description: |
        Delete only the specified user
      operationId: deleteUser
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        '204':
          $ref: "#/components/responses/Deleted"
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'

    patch:
      tags:
        - Users
      summary: Update the specified user
      security:
        - ApiKeyAuth: [ ]
        - bearerAuth: [ ]
      description: |
        Update only the user specified with userId
      operationId: patchUser
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        description: Request parameters
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserBody"
            examples:
              user:
                $ref: "#/components/examples/UserBody"
      responses:
        '200':
          $ref: "#/components/responses/User"
        '400':
          $ref: './common.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.yaml#/components/responses/NotFound'


components:
  examples:

    Deleted:
      summary: An entry is deleted succesfull
      value:

    PagedPrivilegesList-01:
      summary: An empty list of privileges
      value:
        content: [ ]
        pageNumber: 0,
        pageSize: 25,
        totalElements: 0,
        totalPages: 0

    PagedPrivilegesList-02:
      summary: A list of privileges
      value:
        content:
          - id: 1
            name: "ALL"
          - id: 2
            name: "USER"
          - id: 3
            name: "DEVELOPER"
        pageNumber: 0,
        pageSize: 25,
        totalElements: 3,
        totalPages: 1

    PagedRolesList-01:
      summary: An empty list of roles
      value:
        content: [ ]
        pageNumber: 0,
        pageSize: 25,
        totalElements: 0,
        totalPages: 0

    PagedRolesList-02:
      summary: A list of roles
      value:
        content:
          - id: 1
            rolename: "READER"
            description: |
              "Read access to resources"
            privileges:
              - id: 1
                name: "USER"
          - id: 2
            rolename: "WRITER"
            description: |
              "Read and writeaccess to resources"
            privileges:
              - id: 2
                name: "USER"
          - id: 3
            rolename: "ADMIN"
            description: |
              "FULL access to resources"
            privileges:
              - id: 3
                name: "ALL"
        pageNumber: 0,
        pageSize: 25,
        totalElements: 3,
        totalPages: 1

    PagedUsersList-01:
      summary: An empty list of users
      value:
        content: [ ]
        pageNumber: 0,
        pageSize: 25,
        totalElements: 0,
        totalPages: 0

    PagedUsersList-02:
      summary: A list of users
      value:
        content:
          - id: 1
            username: "Peter"
            password: "9494$((DKD))"
            email: "peter@gmail.com"
            phone: "+31694032930"
            accountNonExpired: true
