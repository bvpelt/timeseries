  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        API key for authentication. Three permission levels:
        - READ_WRITE: full CRUD access
        - READ: read-only (GET) access
        - ADMIN: management/full access
        - NO_ACCESS: all requests denied (key is revoked)

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT