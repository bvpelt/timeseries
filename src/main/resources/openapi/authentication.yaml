    RoleList:
      summary: List of known roles
      value:
        - id: 3
          rolename: JWT-TOKEN
          description: The JWT-TOKEN can only be used for JWT authentication
        - id: 4
          rolename: USER
          description: The USER kan only read information

    UserBody:
      summary: New User definition
      value:
        username: "user"
        password: "12345"
