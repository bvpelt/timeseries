    User:
      summary: New user
      value:
        id: 5
        username: "user"
        password: "12345"
        email: "user@gmail.com"
        phone: "0687654321"
        accountNonExpired: true
        accountNonLocked: true
        credentialsNonExpired: true
        enabled: true
        roles: [ ]

    UserList:
      summary: List of known users
      value:
        - id: 4
          username: "user"
          password: "12345"
          email: "user@gmail.com"
          phone: "0687654321"
          accountNonExpired: true
          accountNonLocked: true
          credentialsNonExpired: true
          enabled: true
          roles: [ ]
        - id: 5
          username: "tester"
          password: "12345"
          email: "tester@gmail.com"
          phone: "0687654321"
          accountNonExpired: true
          accountNonLocked: true
          credentialsNonExpired: true
          enabled: true
          roles: [ ]

  headers:
    version:
      required: true
      schema:
        type: "string"
      example: "1.0.0"

  parameters:
    id:
      name: "id"
      in: "path"
      description: "The identification of the resource to return"
      required: true
      schema:
        type: "integer"
        format: "int64"

    override:
      name: "override"
      in: "query"
      description: "parameter to override check on existence"
      required: true
      schema:
        type: "boolean"
        default: false

    page:
      name: "page"
      in: "query"
      description: "pagenumber starts on 1"
      required: true
      schema:
        type: "integer"
        minimum: 1
        default: 1
        format: "int32"

    size:
      name: "size"
      in: "query"
      description: |
        number of elements on each page
        - minimum    1
        - default   25
        - maximum: 100
      required: true
      schema:
        type: "integer"
        maximum: 100
        default: 25
        minimum: 1
        format: "int32"

    sort:
      name: "sort"
      in: "query"
      description: "field names to sort on"
      schema:
        type: "array"
        items:
          type: "string"
        default: [ ]

    X-API-KEY:
      name: "X-API-KEY"
      in: "header"
      required: true
      description: "An api key used to track usage of the api"
      schema:
        $ref: "#/components/schemas/X-API-KEY"

  schemas:

    Id:
      type: integer
      format: int64
      example: 1

    PagedPrivileges:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/Privilege"
        pageNumber:
          type: integer
        pageSize:
          type: integer
        totalElements:
          type: number
          format: int64
        totalPages:
          type: integer

    PagedRoles:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        pageNumber:
          type: integer
        pageSize:
          type: integer
        totalElements:
          type: number
          format: int64
        totalPages:
          type: integer

    PagedUsers:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/User"
        pageNumber:
          type: integer
        pageSize:
          type: integer
        totalElements:
          type: number
          format: int64
        totalPages:
          type: integer

    Role:
      allOf:
        - type: object
          required:
            - id
          properties:
            id:
              $ref: "#/components/schemas/Id"
        - $ref: "#/components/schemas/RoleBody"

    RoleBody:
      type: object
      required:
        - rolename
      properties:
        rolename:
          type: string
          maxLength: 32
          example: reader
        description:
          type: string
          maxLength: 128
          example: This role gives read access
        privileges:
          type: array
          items:
            $ref: "#/components/schemas/Privilege"
          default: [ ]

    Roles:
      type: array
      items:
        $ref: "#/components/schemas/Role"

    User:
      allOf:
        - type: object
          required:
            - id
          properties:
            id:
              $ref: "#/components/schemas/Id"
        - $ref: "#/components/schemas/UserBody"

    UserBody:
      type: object
      required:
        - username
        - email
      properties:
        username:
          $ref: "./common.yaml#/components/schemas/Username"
        password:
          $ref: "./common.yaml#/components/schemas/Password"
        email:
          $ref: "./common.yaml#/components/schemas/Email"
        phone:
          $ref: "#/components/schemas/Phone"
        accountNonExpired:
          type: boolean
          default: true
          example: true
        accountNonLocked:
          type: boolean
          default: true
          example: true
        credentialsNonExpired:
          type: boolean
          default: true
          example: true
        enabled:
          type: boolean
          default: true
          example: true
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
          default: [ ]

    Username:
      type: string
      maxLength: 24
      example: user

    Users:
      type: array
      items:
        $ref: "#/components/schemas/User"

    Phone:
      type: string
      maxLength: 24
      example: "+316409493445"

    Privilege:
      allOf:
        - type: object
          required:
            - id
          properties:
            id:
              $ref: "#/components/schemas/Id"
        - $ref: "#/components/schemas/PrivilegeBody"

    PrivilegeBody:
      type: object
      required:
        - name
      properties:
        name:
          type: string

    ProblemDetail:
      type: object
      required:
        - status
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string

    X-API-KEY:
      type: string
      pattern: "^([0-9a-f]{8})-([0-9a-f]{4})-([0-9a-f]{4})-([0-9a-f]{4})-([0-9a-f]{12})"

