application:
  basePath: "/api/v1"

jwt:
  key: "9dd059be604f3e0b8742724eae817a49d4561fe22bf3519d10d7431dd4b188e4" # using jwtsecret.com/generate 32 bytes 256 bits
  key-lifetime: 14400000 # ms; is 4 uur for testing
  basePath: "/api/v1"

spring:
  application:
    name: timeseries

  data:
    jpa:
      repositories:
        bootstrap-mode: default

  # ===== DATASOURCE =====
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/timeseries}
    username: ${SPRING_DATASOURCE_USERNAME:testuser}
    password: ${SPRING_DATASOURCE_PASSWORD:12345}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ===== JPA =====
  jpa:
    hibernate:
      ddl-auto: none # validate          # Flyway manages the schema; Hibernate only validates
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        validator:
          apply_to_dll=false
        format_sql: true
        default_schema: public
        jdbc:
          time_zone: UTC

  # ===== FLYWAY =====
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false

  # ===== JACKSON =====
  jackson:
    #   serialization:
    #     write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
    time-zone: UTC

# ===== SERVER =====
server:
  port: 8080
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

# ===== SPRINGDOC / SWAGGER UI =====
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: alpha
    tagsSorter: alpha
    try-it-out-enabled: true
    disable-swagger-default-url: false
  # Point to the hand-crafted spec, not the auto-generated one
    urls:
      - name: timeseries
        url: /v3/api-docs/timeseries
      - name: login
        url: /v3/api-docs/login
      - name: authentication
        url: /v3/api-docs/authentication

# ===== LOGGING =====
logging:
  level:
    root: INFO
    com.bsoft.timeseries: TRACE
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
    org.flywaydb: INFO
management:
  endpoint:
    env:
      show-values: always
    configprops:
      show-values: always
    health:
      show-details: always
    metrics:
      access: read_only
    prometheus:
      access: read_only
    shutdown:
      access: unrestricted
  info:
    build:
      enabled: true
    env:
      enabled: true
    git:
      enabled: true
      mode: full
    java:
      enabled: true
    os:
      enabled: true
    process:
      enabled: true
  endpoints:
    web:
      path-mapping:
        info: app-info
        health: app-health
      exposure:
        include: '*'
        exclude:
  server:
    port: 8080

openapi:
  timeseries:
    base-path: /api/v1/timeseries
  login:
    base-path: /api/v1/login
  auth:
    base-path: /api/v1/auth


# ===== APPLICATION PROPERTIES =====
app:
  bitemporal:
    # Sentinel value for "open" end of a temporal period
    infinity: "9999-12-31T23:59:59Z"
  security:
    api-key:
      header-name: X-API-Key

info:
  project:
    name: ${spring.application.name}
    version: @project.version@
    description: @project.description@
  environment: ${spring.profiles.active}